<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Under construction · Value World</title>
<style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;color:#183c2e;background:#f4f6f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(100%,640px);background:#fff;border:1px solid #d7e0d8;border-radius:20px;padding:48px;text-align:center;box-shadow:0 14px 50px #163c2e08}.brand{font-size:14px;font-weight:750;letter-spacing:.12em;margin:0 0 36px}.brand span{color:#ba2631}.icon{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin:0 auto 28px;background:#fff3d8;color:#956022}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:#66796c;margin:0 0 14px}h1{font-size:38px;line-height:1.12;letter-spacing:-.035em;margin:0 0 12px}h2{font-size:24px;line-height:1.3;font-weight:500;margin:0 0 24px}p{font-size:16px;line-height:1.6;color:#5d6e63;margin:12px auto;max-width:440px}.rule{height:1px;background:#e1e7e0;margin:30px 0}.status{display:flex;justify-content:center;align-items:center;gap:9px;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#ad7924}.retry{display:inline-block;background:#1f4b38;color:#fff;font-weight:650;border:0;border-radius:8px;padding:13px 22px;margin:20px 0 4px;font-size:14px;cursor:pointer}.retry:focus-visible{outline:3px solid #bd2835;outline-offset:4px}.foot{font-size:12px;color:#718075}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:560px){body{padding:18px}.card{padding:34px 22px}h1{font-size:32px}h2{font-size:21px}}
</style>
</head>
<body>
<main class="card">
<p class="brand"><span>VALUE</span> WORLD</p>
<div class="icon" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 30h20M15 29l5-20h4l5 20M17 21h10M19 14h6M10 35h24" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<p class="eyebrow">A quick update is underway</p>
<h1>Under construction</h1>
<h2>Be Back in a Few Minutes</h2>
<p>We’re updating the site. Thank you for your patience while we get everything ready.</p>
<div class="rule"></div>
<p class="status"><span class="dot" aria-hidden="true"></span>This page checks for availability automatically.</p>
<button class="retry" id="retry" type="button">Check again</button>
<p class="foot">You’ll return to the site when the update is complete.</p>
<p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
<noscript><p>Automatic checks need JavaScript. Refresh this page in a few minutes.</p></noscript>
</main>
<script>
// A fresh GET avoids resubmitting any form POST that received maintenance HTML.
// Sevalla restores this same URL after maintenance mode is disabled.
function check(){ location.replace(location.href); }
document.getElementById('retry').addEventListener('click',check);
setTimeout(check,15000);
</script>
</body>
</html>
